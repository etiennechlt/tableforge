project: couronnes-cendres

providers:
  ark:
    type: seedream
    base_url: https://ark.ap-southeast.bytepluses.com/api/v3
    api_key_env: ARK_API_KEY
    model: seedream-5-0-260128
    default_size: "4704x3520"
    watermark: false
  eleven:
    type: elevenlabs
  higgsfield:
    type: higgsfield

voices:                       # noms humains -> voice_id ElevenLabs (voix premade publiques)
  narrateur:     JBFqnCBsd6RMkjVDRZzb
  vieille-reine: EXAVITQu4vr4xnSDxMaL
  heraut:        TxGEqnHWrfWFTfGW9XjX

defaults:
  max_refs: 2
  ref_max_px: 1024

kinds:
  cards:
    data: data/cards.yaml
    prompts: prompts/cards.yaml
    template: templates/card
    capture_selector: ".cc-card"
    render_size: { width: 744, height: 1039 }
    scale: 3
    generate: { with: ark }
    sheet:
      page: A4
      cols: 3
      rows: 3
      card_w_mm: 63
      card_h_mm: 88
      gap_mm: 4
      cut_marks: true
  board:
    data: data/board.yaml
    template: templates/board
    capture_selector: ".cc-board"
    render_size: { width: 2480, height: 3508 }   # A4 @300 dpi
    scale: 1

  musiques:
    asset: music
    prompts: prompts/musiques.yaml
    generate: { with: eleven }

  nappes:                       # soundscapes = sfx avec loop: true (defaults du catalogue)
    asset: sfx
    prompts: prompts/nappes.yaml
    generate: { with: eleven }

  sfx:
    asset: sfx
    prompts: prompts/sfx.yaml
    generate: { with: eleven }

  narration:                  # lit chaque carte : gabarit Jinja sur les rows de cards
    asset: tts
    data: data/cards.yaml
    generate:
      with: eleven
      voice: narrateur
      text: "{{ name }}. {{ eff }}"
      language: fr
  voix-pnj:                   # une voix par personnage via voice_field
    asset: tts
    data: data/pnj.yaml
    generate: { with: eleven, text: "{{ replique }}", voice_field: voice }
  dialogues:                  # scènes multi-voix
    asset: dialogue
    prompts: prompts/dialogues.yaml
    generate: { with: eleven }

  cartes-animees:
    asset: video
    from: cards
    prompts: prompts/cartes-animees.yaml
    generate: { with: higgsfield, model: bytedance/seedance/v1/image-to-video }

  teaser:
    asset: video
    prompts: prompts/teaser.yaml
    generate:
      with: higgsfield
      model: kling-video/v2.1/standard/text-to-video
      aspect_ratio: "16:9"
