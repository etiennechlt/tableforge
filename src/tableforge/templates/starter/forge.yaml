project: __PROJECT_NAME__

providers:                          # les comptes pour lesquels tu as une clé (type: obligatoire)
  ark:
    type: seedream
    base_url: https://ark.ap-southeast.bytepluses.com/api/v3
    api_key_env: ARK_API_KEY        # NOM de la variable d'env (jamais la clé)
    model: seedream-5-0-260128
    default_size: "4704x3520"
    watermark: false
  eleven:
    type: elevenlabs                # tout a un défaut sain (base_url, formats, modèles)

defaults:
  max_refs: 3
  ref_max_px: 1024

kinds:
  cards:
    data: data/cards.yaml
    prompts: prompts/cards.yaml
    template: templates/card
    capture_selector: ".forge-asset"
    render_size: { width: 744, height: 1039 }   # 63×88 mm @300 dpi
    scale: 3
    generate: { with: ark }
    sheet:
      page: A4
      cols: 3
      rows: 3
      card_w_mm: 63
      card_h_mm: 88
      gap_mm: 4
      cut_marks: true

  musiques:                         # pistes d'ambiance (ElevenLabs Music — plan payant ;
    asset: music                    # sinon : forge studio musiques)
    prompts: prompts/musiques.yaml
    generate: { with: eleven }

  sfx:                              # effets sonores one-shot ; nappe = loop: true au catalogue
    asset: sfx
    prompts: prompts/sfx.yaml
    generate: { with: eleven }

# --- Voix (ElevenLabs) : exemples à décommenter
# 1. Ajoute un provider elevenlabs (clé : ELEVENLABS_API_KEY dans .env) :
#   providers:
#     eleven:
#       type: elevenlabs
# 2. Déclare tes voix (noms humains -> voice_id, cf. `forge voices list`) :
#   voices:
#     narrateur: JBFqnCBsd6RMkjVDRZzb
# 3. Ajoute deux kinds vocaux :
#
# narration:                      # TTS pour chaque carte (gabarit Jinja)
#   asset: tts
#   data: data/cards.yaml
#   generate:
#     with: eleven
#     voice: narrateur
#     text: "{{ name }}. {{ eff }}"
#     language: fr
#
# regles-audio:                   # Catalogue TTS libre (voir prompts/regles-audio.yaml)
#   asset: tts
#   prompts: prompts/regles-audio.yaml
#   generate: { with: eleven, voice: narrateur, language: fr }

# --- Vidéo (Higgsfield) : exemple à décommenter
# 1. Ajoute un provider higgsfield (clés : HIGGSFIELD_API_KEY + HIGGSFIELD_API_SECRET
#    dans .env — comptes sur https://platform.higgsfield.ai) :
#   providers:
#     higgsfield:
#       type: higgsfield
# 2. Ajoute un kind vidéo i2v qui anime l'art déjà généré du kind `cards`
#    (out/art/cards/<id>.png) :
#
# cartes-animees:                 # i2v : anime chaque carte de `cards`
#   asset: video
#   from: cards
#   generate: { with: higgsfield, model: bytedance/seedance/v1/image-to-video }
