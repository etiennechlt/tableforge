[project]
name = "tableforge"
version = "0.1.0"
description = "Générateur d'assets de jeu (cartes, plateau/map, designs, art IA) piloté par configuration."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Etienne Chalot", email = "etiennechalot@gmail.com" }]
keywords = ["board-game", "card-game", "asset-generation", "print-and-play", "ai-art"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "jinja2",
    "pillow",
    "openai>=1.0",
    "httpx",
    "python-dotenv",
    "typer>=0.12",
    "playwright",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "respx"]

[project.scripts]
forge = "tableforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tableforge"]

[tool.hatch.build.targets.wheel.force-include]
"src/tableforge/templates" = "tableforge/templates"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["tableforge"]
omit = ["*/render.py", "*/cli.py", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]

[project.urls]
Repository = "https://github.com/etiennechlt/tableforge"
